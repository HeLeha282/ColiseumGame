<style>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const SOUNDS = window.SOUNDS || [];
const BY_NAME = Object.fromEntries(SOUNDS.map((s) => [s.name, s]));
const BASES = SOUNDS.map((s) => s.name).sort((a, b) => b.length - a.length);
const AUDIO_EXT = /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i;
const D2R = Math.PI / 180;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600);
}

/** Имя файла → имя звука (самое длинное совпадение: sword_swing_heavy_2 → sword_swing_heavy). */
function matchBase(fname) {
  const f = fname.toLowerCase().replace(/\.[^.]+$/, "");
  for (const b of BASES) if (f === b || (f.startsWith(b) && /[^a-z]/.test(f[b.length]))) return b;
  return null;
}

// =====================================================================================================
// 3D-сцена. Всё строится в координатах Unity (Y вверх, герой смотрит в +Z): корень U зеркалит Z.
// =====================================================================================================
const canvas = $("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2430);
scene.fog = new THREE.Fog(0x2a2430, 18, 60);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffe9c8, 0x403040, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2);
sun.position.set(6, 10, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
scene.add(sun);
const U = new THREE.Group(); U.scale.set(1, 1, -1); scene.add(U);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0xc9a36c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; U.add(ground);
let stage = new THREE.Group(); U.add(stage);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
  }
}
/** Камера в координатах Unity. */
function cam(px, py, pz, tx, ty, tz, fov = 45) {
  camera.position.set(px, py, -pz); controls.target.set(tx, ty, -tz); camera.fov = fov; camera.updateProjectionMatrix(); controls.update();
}

const matCache = {};
function M(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache[key]) {
    const m = o.basic ? new THREE.MeshBasicMaterial({ color }) : new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.75, metalness: o.metal ?? 0 });
    if (o.emissive) { m.emissive = new THREE.Color(o.emissive); m.emissiveIntensity = o.ei ?? 1; }
    if (o.opacity != null) { m.transparent = true; m.opacity = o.opacity; m.depthWrite = false; }
    if (o.add) { m.blending = THREE.AdditiveBlending; m.transparent = true; m.depthWrite = false; }
    if (o.side) m.side = THREE.DoubleSide;
    matCache[key] = m;
  }
  return matCache[key];
}
function mesh(geo, mat, parent, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(rot[0] * D2R, rot[1] * D2R, rot[2] * D2R);
  m.castShadow = !mat.transparent; m.receiveShadow = true;
  (parent || stage).add(m); return m;
}
const box = (w, h, d, mat, parent, pos, rot) => mesh(new THREE.BoxGeometry(w, h, d), mat, parent, pos, rot);
const cyl = (r1, r2, h, mat, parent, pos, rot, seg = 16) => mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat, parent, pos, rot);
const sph = (r, mat, parent, pos, rot) => mesh(new THREE.SphereGeometry(r, 20, 14), mat, parent, pos, rot);
function grp(parent, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const g = new THREE.Group(); g.position.set(...pos); g.rotation.set(rot[0] * D2R, rot[1] * D2R, rot[2] * D2R);
  (parent || stage).add(g); return g;
}

// ---------- эффекты (живут в координатах Unity, сбрасываются каждый повтор) ----------
let fx = [];
function addFx(obj, life, update) { stage.add(obj); fx.push({ obj, life, age: 0, update }); return obj; }
function tickFx(dt) {
  fx = fx.filter((f) => {
    f.age += dt; const k = f.age / f.life;
    if (k >= 1) { f.obj.parent && f.obj.parent.remove(f.obj); return false; }
    f.update && f.update(f.obj, k, dt, f); return true;
  });
}
function clearFx() { for (const f of fx) f.obj.parent && f.obj.parent.remove(f.obj); fx = []; }
const P = (x, y, z) => new THREE.Vector3(x, y, z);

/** Частицы: pos — центр, n — сколько, speed, life, size, gravity, color, up — добавка вверх. */
function burst(pos, color, { n = 20, speed = 3, life = 0.7, size = 0.06, gravity = -6, up = 1, spread = 1, add = true, dir = null } = {}) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false });
  const geo = new THREE.SphereGeometry(1, 6, 4);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(geo, mat);
    m.position.copy(pos);
    const v = P(rnd(-1, 1) * spread, rnd(0, 1) * up + rnd(-.3, .3), rnd(-1, 1) * spread).normalize().multiplyScalar(speed * rnd(.4, 1));
    if (dir) v.add(dir.clone().multiplyScalar(speed));
    const s = size * rnd(.6, 1.4); m.scale.setScalar(s);
    const l = life * rnd(.6, 1.2);
    addFx(m, l, (o, k, dt) => { v.y += gravity * dt; o.position.addScaledVector(v, dt); o.scale.setScalar(s * (1 - k * .8)); mat.opacity = 1 - k; });
  }
}
/** Вспышка-сфера, которая расширяется и гаснет. */
function flash(pos, color, size = 1, life = 0.3) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), mat); m.position.copy(pos);
  return addFx(m, life, (o, k) => { o.scale.setScalar(size * (0.3 + k)); mat.opacity = 1 - k; });
}
/** Кольцо по земле (ударная волна). */
function ring(pos, color, radius = 3, life = 0.6, thick = 0.12) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const m = new THREE.Mesh(new THREE.RingGeometry(1 - thick, 1, 64), mat); m.position.copy(pos); m.rotation.x = -Math.PI / 2;
  return addFx(m, life, (o, k) => { const r = 0.2 + radius * (1 - Math.pow(1 - k, 2)); o.scale.set(r, r, r); mat.opacity = 1 - k; });
}
/** Луч от from до to. */
function beam(from, to, color, width = 0.3, life = 0.4) {
  const len = from.distanceTo(to);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, len, 12, 1, true), mat);
  m.position.copy(from).add(to).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(P(0, 1, 0), to.clone().sub(from).normalize());
  return addFx(m, life, (o, k) => { const w = width * (1 - k * .7); o.scale.set(w, 1, w); mat.opacity = 1 - k; });
}
/** Молния — ломаная линия. */
function bolt(from, to, color = 0xbfe0ff, life = 0.2, jag = 0.35) {
  const pts = []; const n = 10;
  for (let i = 0; i <= n; i++) {
    const p = from.clone().lerp(to, i / n);
    if (i > 0 && i < n) p.add(P(rnd(-jag, jag), rnd(-jag, jag), rnd(-jag, jag)));
    pts.push(p);
  }
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[i + 1], len = a.distanceTo(b);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, len, 5), new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(P(0, 1, 0), b.clone().sub(a).normalize()); g.add(m);
  }
  return addFx(g, life, (o, k) => o.children.forEach((c) => c.material.opacity = 1 - k));
}
/** Летящий снаряд: obj из from в to за time, arc — высота дуги; onHit — в конце. */
function fly(obj, from, to, time, arc = 0, onHit, spin = 0) {
  stage.add(obj); obj.position.copy(from);
  const dir = to.clone().sub(from);
  return addFx(obj, time, (o, k) => {
    o.position.copy(from).addScaledVector(dir, k); o.position.y += Math.sin(Math.PI * k) * arc;
    const ahead = from.clone().addScaledVector(dir, Math.min(1, k + .02)); ahead.y += Math.sin(Math.PI * Math.min(1, k + .02)) * arc;
    if (!spin) o.lookAt(U.localToWorld(ahead.clone())); else o.rotation.x += spin * 0.016;
    if (k > 0.97 && !o.userData.hit) { o.userData.hit = true; onHit && onHit(); }
  });
}
function overlay(html) { $("ov").innerHTML = html; return $("ov").firstElementChild; }

// =====================================================================================================
// Катана и удары (копия SwordSwing.cs)
// =====================================================================================================
const ATTACKS = [
  { tilt: 35, yawFrom: 105, yawTo: -80, roll: -90, posFrom: [0.12, 0.18, -0.12], posTo: [-0.42, -0.16, 0.08], windup: 0.07, slash: 0.11, hold: 0.05, recover: 0.22 },
  { tilt: 28, yawFrom: -95, yawTo: 85, roll: 90, posFrom: [-0.38, -0.2, 0], posTo: [0.12, 0.16, 0.02], windup: 0.07, slash: 0.11, hold: 0.05, recover: 0.22 },
  { tilt: 82, yawFrom: 125, yawTo: -35, roll: -90, posFrom: [-0.15, 0.32, -0.15], posTo: [-0.2, -0.22, 0.15], windup: 0.14, slash: 0.12, hold: 0.08, recover: 0.28 },
];
const hitTime = (a) => a.windup + a.slash * 0.5;
const qAxis = (deg, x, y, z) => new THREE.Quaternion().setFromAxisAngle(P(x, y, z), deg * D2R);
/** Quaternion.Euler из Unity: сначала Z, потом X, потом Y. */
const qEuler = (x, y, z) => qAxis(y, 0, 1, 0).multiply(qAxis(x, 1, 0, 0)).multiply(qAxis(z, 0, 0, 1));
const REST = qEuler(-32, -12, 0);
const swingRot = (a, yaw) => qAxis(a.tilt, 0, 0, 1).multiply(qAxis(yaw, 0, 1, 0)).multiply(qAxis(a.roll, 0, 0, 1));
function evalSwing(a, t, sp, sr, outP, outQ) {
  if (t < a.windup) { const k = smooth(t / a.windup); outP.lerpVectors(sp, P(...a.posFrom), k); outQ.slerpQuaternions(sr, swingRot(a, a.yawFrom), k); return; }
  t -= a.windup;
  if (t < a.slash) { const k = 1 - Math.pow(1 - t / a.slash, 2.2); outP.lerpVectors(P(...a.posFrom), P(...a.posTo), k); outQ.copy(swingRot(a, lerp(a.yawFrom, a.yawTo, k))); return; }
  t -= a.slash; outP.set(...a.posTo); outQ.copy(swingRot(a, a.yawTo));
  if (t < a.hold) return;
  t -= a.hold; const r = smooth(t / a.recover);
  outP.lerp(P(0, 0, 0), r); outQ.slerp(REST, r);
}

let KATANA = null;
async function loadKatana() {
  if (!window.KATANA_GLB) return;
  const bin = Uint8Array.from(atob(window.KATANA_GLB), (c) => c.charCodeAt(0)).buffer;
  const gltf = await new GLTFLoader().parseAsync(bin, "");

  attack(S, t, dt, p, e) {   // замах и удар правой рукой
    const k = clamp01((t - 0.05) / 0.25); if (e.arms) e.arms[1].rotation.x = (t < 0.05 ? 0 : t < 0.3 ? lerp(-40, -160, smooth((t - .05) / .12)) * (t < .17 ? 1 : 0) + (t >= .17 ? lerp(-160, -10, smooth((t - .17) / .13)) : 0) : -10) * D2R;
    e.body.position.z = Math.sin(clamp01((t - 0.15) * 3) * Math.PI) * 0.25;
    if (e.kind === "skeleton" && S.ev("rattle")) burst(P(0, 1.2, 0), 0xf0e8d0, { n: 4, speed: .6, add: false, size: .02, gravity: -4 });
    if (S.ev("hit", t >= 0.3)) { flash(P(0, 1.1 * e.s, 0.9 * e.s), 0xffffff, .3, .1); if (e.kind === "shield") burst(P(0, 1.1, 0.7), 0xffd27a, { n: 10, speed: 3, size: .03 }); }
  },
  shieldbash(S, t, dt, p, e) { e.body.position.z = Math.sin(clamp01((t - 0.1) * 4) * Math.PI) * 0.5; e.arms[0].rotation.x = -80 * D2R; if (S.ev("h", t >= 0.22)) { flash(P(0, 1.1, 0.9), 0xfff0c0, .5, .12); burst(P(0, 1.1, 0.9), 0xffd27a, { n: 12, speed: 3, size: .03 }); } },
  death(S, t, dt, p, e) {
    if (["skeleton", "golem", "titan", "lemur"].includes(e.kind) || p.style === "crumble") {
      if (e.kind === "lemur") { e.g.position.y = e.base.y + t * 0.6; e.mat.opacity = Math.max(0, 0.55 - t * 0.4); if (S.ev("p" + Math.floor(t * 20))) burst(P(rnd(-.3, .3), 1 + t, 0), 0xbfe6ff, { n: 2, speed: .4, gravity: 1, size: .05 }); return; }
      crumble(e, clamp01(t / 1.2)); if (S.ev("d")) burst(P(0, 1 * e.s, 0), e.kind === "golem" ? 0xbfeaff : 0xd8c09a, { n: 30, speed: 2.5, add: false, size: .06 * e.s, gravity: -6 });
      return;
    }
    if (e.wings) { e.g.position.y = Math.max(0.3, e.base.y - t * t * 4); e.g.rotation.z = t * 2; e.wings.forEach((w, i) => w.rotation.z = (i ? -1 : 1) * 0.6); return; }
    if (e.kind === "salamander") { if (S.ev("x", t >= 0.15)) { flash(P(0, .6, 0), 0xff8030, 2, .4); burst(P(0, .5, 0), 0xff6a20, { n: 50, speed: 5, size: .1 }); e.g.visible = false; } e.g.scale.setScalar(1 + clamp01(t / .15) * 0.3); return; }
    const k = smooth((t - 0.05) / 0.7); e.g.rotation.x = -k * 85 * D2R; if (e.arms) e.arms.forEach((a) => a.rotation.x = -k * 60 * D2R);
    if (S.ev("thud", t >= 0.75)) burst(P(0, 0.1, -1 * e.s), 0xd8c09a, { n: 20, speed: 1.5 * e.s, add: false, size: .07 * e.s, gravity: -2, up: .4 });
    if (e.necks) e.necks.forEach((n) => n.neck.rotation.x = -k * 1.4);
  },
  roar(S, t, dt, p, e) {   // рёв / смех / шипение: голова вверх, дрожь, волны
    const k = Math.sin(clamp01(t / (p.dur || 1.2)) * Math.PI);
    if (e.head) e.head.rotation.x = -k * 0.5; if (e.heads) e.heads.forEach((h, i) => { h.jaw.rotation.x = k * 0.6 * (0.8 + 0.2 * Math.sin(t * 30 + i)); h.neck.rotation.x = -k * 0.4; });
    if (e.necks) e.necks.forEach((n, i) => { n.neck.rotation.x = -k * 0.4 + Math.sin(t * 6 + i) * 0.1; });
    e.body.position.x = Math.sin(t * 50) * 0.02 * k * (e.s || 1);
    if (p.bounce) e.body.position.y = Math.abs(Math.sin(t * 14)) * 0.1 * k;
    if (e.wings) e.wings.forEach((w, i) => w.rotation.z = (i ? -1 : 1) * Math.sin(t * 14) * 0.6);
    if (p.waves) for (let i = 0; i < 3; i++) if (S.ev("w" + i, t >= 0.1 + i * 0.3)) ring(P(0, 1.6 * (e.s || 1), 0.4), p.wc || 0xffe0c0, 2.5 * (e.s || 1), .6, .06);
  },
  jump(S, t, dt, p, e) { const k = clamp01((t - 0.05) / 0.6); e.g.position.y = Math.sin(k * Math.PI) * 1.5; e.g.position.z = e.base.z + k * 2; e.legs.forEach((l, i) => l.rotation.x = (k > 0 && k < 1 ? (i ? -40 : 30) : 0) * D2R); if (S.ev("l", t >= 0.65)) burst(P(0, 0.05, 2), 0xd8c09a, { n: 12, speed: 1.5, add: false, size: .06, gravity: -2, up: .4 }); },
  smash(S, t, dt, p, e) {
    e.arms[1].rotation.x = (t < 0.25 ? lerp(0, -170, smooth(t / 0.25)) : lerp(-170, -40, smooth((t - 0.25) / 0.1))) * D2R;
    if (S.ev("s", t >= 0.35)) { const g = P(0, 0.05, 1.3 * e.s); ring(g, 0xd8c09a, 3 * e.s / 1.8, .5); burst(g, 0xb9a688, { n: 30, speed: 3, add: false, size: .08, gravity: -8 }); flash(g, 0xfff0d0, .8, .2); }
  },
  axe(S, t, dt, p, e) { FOE_ACT.smash(S, t + (t > 0.05 ? 0 : 0), dt, p, e); },
  march(S, t, dt, p, e) { const all = [e, ...(S.more || [])]; all.forEach((m) => { walkPose(m, t * Math.PI * 2 / 0.7, 20); m.g.position.z = m.base.z + (t % 6) * 0.3; }); if (S.ev("st" + Math.floor(t / 0.35))) burst(P(0, 0.05, e.g.position.z), 0xd8c09a, { n: 6, speed: 1, add: false, size: .06, gravity: -2, up: .3 }); },
  cast(S, t, dt, p, e) {
    e.arms[1].rotation.x = lerp(0, -110, smooth(t / 0.25)) * D2R;
    const col = p.el === "ice" ? 0x9fd8ff : 0xff6a20;
    if (S.ev("c", t >= 0.2)) { const orb = sph(0.18, M(col, { emissive: col, ei: 2 })); flash(P(0.4, 1.9, 0.6), col, .6, .3); fly(orb, P(0.4, 1.9, 0.6), P(0.4, 1.0, 9), 0.7, 0.3, () => {}); }
    if (t < 0.9 && S.ev("p" + Math.floor(t * 30))) burst(P(0.4, 1.9, 0.6), col, { n: 2, speed: .5, gravity: p.el === "ice" ? -1 : 2, size: .05 });
  },
  impact(S, t, dt, p, e) {
    e.g.visible = false;
    const col = p.el === "ice" ? 0x9fd8ff : 0xff6a20;
    if (S.ev("c", t >= 0.05)) { const orb = sph(0.2, M(col, { emissive: col, ei: 2 })); fly(orb, P(0, 1.8, -8), P(0, 1.2, -0.3), 0.5, 0.2, () => { flash(P(0, 1.2, -0.3), col, 1.2, .35); burst(P(0, 1.2, -0.3), col, { n: 40, speed: 4, size: .07, gravity: p.el === "ice" ? -8 : 1 }); }); }
  },
  shoot(S, t, dt, p, e) { const r = e.rider || e; r.arms[0].rotation.x = -90 * D2R; r.arms[1].rotation.x = lerp(-90, -70, clamp01(t * 4)) * D2R; if (S.ev("s", t >= 0.05)) { const a = grp(null); cyl(0.012, 0.012, 0.8, M(0x8a6a4a), a, [0, 0, 0], [90, 0, 0]); fly(a, P(0, 2.0, 1.0), P(0, 1.2, 12), 0.4, 0.3); } },
  gallop(S, t, dt, p, e) { const ph = t * Math.PI * 2 / 0.45; e.legs.forEach((l, i) => l.rotation.x = Math.sin(ph + (i < 2 ? 0 : Math.PI) + (i % 2) * 0.6) * 0.7); e.body.position.y = Math.abs(Math.sin(ph)) * 0.1; },
  heal(S, t, dt, p, e) { e.arms[1].rotation.x = -120 * D2R; if (S.ev("h")) { ring(P(0, 0.1, -0.3), 0xffd27a, 3, 1.4); flash(P(0, 2.5, 0), 0xffd27a, .8, 1.2); } if (t < 1.6 && S.ev("p" + Math.floor(t * 15))) S.more.forEach((m) => burst(m.g.position.clone().add(P(rnd(-.3, .3), 0.3, 0)), 0xffe08a, { n: 1, speed: .5, gravity: 1.5, size: .05 })); },
  appear(S, t, dt, p, e) { e.g.visible = true; const k = clamp01(t / 1.0); e.mat.opacity = 0.55 * k; e.g.position.y = e.base.y - (1 - k) * 1.2; if (S.ev("p" + Math.floor(t * 15)) && t < 1) burst(P(rnd(-.4, .4), 0.2, rnd(-.4, .4)), 0xbfe6ff, { n: 1, speed: .4, gravity: 1, size: .05 }); },
  step(S, t, dt, p, e) { walkPose(e, (t / 1.4) * Math.PI * 2, 25); e.g.position.z = e.base.z + t * 0.5; if (S.ev("st", t >= 0.35)) { const g = P(e.legs ? 0.15 * e.s : 0, 0.05, e.g.position.z + 0.2); ring(g, p.kind === "golem" ? 0xbfeaff : 0xd8c09a, 1.6 * e.s / 1.6, .5); burst(g, p.kind === "golem" ? 0xdff4ff : 0xb9a688, { n: 18, speed: 2, add: false, size: .07 * e.s / 1.6, gravity: -6, up: .4 }); } },
  wings(S, t, dt, p, e) { e.wings.forEach((w, i) => w.rotation.z = (i ? -1 : 1) * Math.sin(t * Math.PI * 2 / 0.5) * 0.7); e.g.position.y = e.base.y + Math.sin(t * Math.PI * 2 / 0.5 + 1) * 0.12; },
  split(S, t, dt, p, e) { const k = smooth((t - 0.05) / 0.4); if (!S.twin) { S.twin = enemy("hydraling", { pos: [0, 0, 0] }); } S.twin.g.visible = t > 0.05; S.twin.g.position.x = k * 1.1; e.g.position.x = -k * 1.1; if (S.ev("s")) burst(P(0, 0.4, 0), 0x6aa04a, { n: 20, speed: 2, add: false, size: .06 }); },
  bite(S, t, dt, p, e) { const h = e.heads[p.head ?? 1]; const k = Math.sin(clamp01((t - 0.05) / 0.3) * Math.PI); h.neck.position.z = 0.6 + k * 0.5; h.jaw.rotation.x = (t < 0.2 ? 0.7 : 0) + (t >= 0.25 ? 0 : 0); if (S.ev("b", t >= 0.25)) flash(P(0, 2.4, 2.4), 0xffffff, .4, .1); },
  headdown(S, t, dt, p, e) { const h = e.heads[2]; const k = smooth((t - 0.05) / 0.6); h.neck.rotation.x = k * 1.2; h.neck.rotation.z = k * 0.4; if (S.ev("f")) flash(P(0.6, 2.6, 1.4), 0x8a40ff, .6, .3); },
  headcut(S, t, dt, p, e) { const n = e.necks[2]; if (S.ev("c")) { burst(n.h.getWorldPosition(P()).applyMatrix4(U.matrixWorld.clone().invert()), 0x2a6a2a, { n: 30, speed: 3, add: false, size: .08 }); flash(P(0, 3.4, 1), 0xffffff, .6, .1); } n.h.visible = t < 0.05; n.neck.children.slice(3).forEach((c) => c.visible = t < 0.05); },
  regrow(S, t, dt, p, e) { const k = smooth((t - 0.05) / 0.8); e.necks.forEach((n, i) => { if (i === 1 || i === 3) n.neck.scale.setScalar(Math.max(0.01, k)); }); if (S.ev("g")) burst(P(0, 2.4, 0.4), 0x4a8a3a, { n: 30, speed: 2.5, add: false, size: .08 }); },
  cauterize(S, t, dt, p, e) { const n = e.necks[2]; n.h.visible = false; const pos = P(0, 2.3, 1.4); if (t < 1.4 && S.ev("p" + Math.floor(t * 30))) { burst(pos, 0xff8a30, { n: 2, speed: .8, gravity: 2, size: .08 }); burst(pos, 0x8a8a8a, { n: 1, speed: .6, gravity: 2, size: .12, add: false }); } if (S.ev("f")) flash(pos, 0xffb060, .8, .3); },
  gaze(S, t, dt, p, e) { const head = e.top.head; head.rotation.x = -0.2; if (S.ev("g", t >= 0.2)) { beam(P(0, 2.0, 0.5), P(0, 1.4, 9), 0xb0ff90, 0.6, 1.4); } if (t > 0.3 && t < 2.2 && S.ev("p" + Math.floor(t * 15))) burst(P(rnd(-1, 1), rnd(.3, 2), rnd(2, 9)), 0x9a948a, { n: 2, speed: .4, add: false, size: .06, gravity: -1 }); },
  petrify(S, t, dt, p, e) { const k = clamp01(t / 0.9); e.g.traverse((o) => { if (o.isMesh) { o.userData.m0 = o.userData.m0 || o.material; o.material = (o.position.y + 0.2) < k * 2 ? M(0x8d8780) : o.userData.m0; } }); if (t < .9 && S.ev("p" + Math.floor(t * 20))) burst(P(rnd(-.3, .3), k * 1.8, 0.2), 0x9a948a, { n: 2, speed: .5, add: false, size: .04, gravity: -4 }); },
  unpetrify(S, t, dt, p, e) { e.g.traverse((o) => { if (o.isMesh) { o.userData.m0 = o.userData.m0 || o.material; o.material = t < 0.25 ? M(0x8d8780) : o.userData.m0; } }); if (S.ev("b", t >= 0.25)) { burst(P(0, 1, 0), 0x8d8780, { n: 40, speed: 3, add: false, size: .07, gravity: -9 }); flash(P(0, 1, 0), 0xfff0d0, 1, .3); } },
  summon(S, t, dt, p, e) { FOE_ACT.roar(S, t, dt, { ...p, waves: true, wc: 0xd0b0ff }, e); S.more.forEach((m, i) => { const t0 = 0.4 + i * 0.25; m.g.visible = t >= t0; if (t >= t0) { m.g.position.y = m.base.y + (1 - clamp01((t - t0) / .5)) * 4; m.wings.forEach((w, j) => w.rotation.z = (j ? -1 : 1) * Math.sin(t * 14) * 0.7); } }); },
  wingsripped(S, t, dt, p, e) { e.g.position.y = Math.max(0.2, e.base.y - Math.max(0, t - 0.3) ** 2 * 6); e.wings.forEach((w, i) => { if (t > 0.1) { w.position.x = (i ? 1 : -1) * (0.16 + (t - .1) * 3); w.position.y = 0.4 - (t - .1) * 2; w.rotation.z = (i ? 1 : -1) * t * 4; } }); if (S.ev("r", t >= 0.1)) burst(P(0, e.base.y + 0.8, 0), 0x6a4a3a, { n: 40, speed: 3, add: false, size: .08 }); },
  phase(S, t, dt, p, e) { if (S.ev("b")) { flash(P(0, 4, 0), 0xffd27a, 3, .4); burst(P(0, 4, 0), 0xb47a35, { n: 40, speed: 6, add: false, size: .15, gravity: -9 }); ring(P(0, .1, 0), 0xffd27a, 8, .8); } e.body.position.x = Math.sin(t * 40) * 0.05 * Math.max(0, 1 - t); },
  armorbreak(S, t, dt, p, e) { FOE_ACT.phase(S, t, dt, p, e); },
  fall(S, t, dt, p, e) { const k = smooth((t - 0.05) / 2.2); e.g.rotation.x = -k * 85 * D2R; e.g.rotation.z = k * 0.2; if (S.ev("t", t >= 2.25)) { ring(P(0, .1, -4), 0xd8c09a, 12, 1.2, .2); burst(P(0, .5, -6), 0xb9a688, { n: 80, speed: 5, add: false, size: .2, gravity: -6 }); } },
  slowmo(S, t, dt, p, e) { const k = Math.sin(clamp01(t / 1.5) * Math.PI); renderer.toneMappingExposure = 1.05 - 0.5 * k; e.arms[1].rotation.x = lerp(-20, -90, k) * D2R; if (S.ev("hb", t >= 0.2) || S.ev("hb2", t >= 0.8)) ring(P(0, 1.5 * e.s, 1), 0xff4040, 3, .5, .04); },
  finisher(S, t, dt, p, e) {
    if (!S.h) { S.h = makeHero([0, 0, 5.6]); S.h.root.rotation.y = Math.PI; S.h.root.scale.setScalar(1); }
    if (S.ev("start")) { heroReset(S.h); S.h.root.position.set(0, 0, 5.6); S.h.root.rotation.y = Math.PI; heroSwing(S.h, 2, 0.05); }
    heroTick(S.h, t);
    if (S.ev("hit", t >= 0.05 + hitTime(ATTACKS[2]))) { flash(P(0, 2.5, 3.8), 0xfff0c0, 2.5, .4); ring(P(0, 0.1, 4), 0xffe0a0, 6, .7); burst(P(0, 2.5, 4), 0xffd27a, { n: 60, speed: 6, size: .05, gravity: -6 }); }
  },
};

  newenemy: { make: () => overlay('<div class="ui-panel" style="text-align:center">НОВЫЙ ВРАГ<br><b style="font-size:28px">Циклоп</b><br><small>Крушит баррикады с одного удара</small></div>'), tick: (S, t, dt, p, el) => { const k = smooth((t - 0.05) / 0.5); el.style.opacity = k; el.style.transform = `scale(${0.7 + 0.3 * k})`; } },
  banner: { make: (S, p) => overlay(`<div class="ui-banner">${p.text}</div>`), tick: (S, t, dt, p, el) => { const k = smooth((t - 0.05) / 0.5), out = smooth((t - (p.len || 3) + 0.8) / 0.6); el.style.opacity = k * (1 - out); el.style.transform = `scale(${1.4 - 0.4 * k}) translateY(${-20 * out}px)`; el.style.color = p.color || "#f6deb0"; } },
  warning: { make: (S, p) => overlay(`<div class="ui-banner" style="color:#ff6a5a">${p.text}</div>`), tick: (S, t, dt, p, el) => { el.style.opacity = 0.5 + 0.5 * Math.sin(t * 6); $("ov").style.boxShadow = `inset 0 0 ${120 + 60 * Math.sin(t * 6)}px rgba(200,20,10,.6)`; } },
  portal_hit: { make: () => null, tick: (S, t, dt, p) => { if (S.ev("h")) { const pos = P(0, 2.7, 6); flash(pos, 0xc080ff, 2.5, .3); burst(pos, 0xc080ff, { n: 40, speed: 5, size: .06 }); } S.p.core.scale.set(1.5 + Math.sin(clamp01(t * 4) * Math.PI) * .3, 2.3, 1.5); } },

// Состояние, список, проигрывание

const actx = new (window.AudioContext || window.webkitAudioContext)();
const master = actx.createGain(); master.connect(actx.destination);
master.gain.value = 0.8;
document.addEventListener("pointerdown", () => actx.state !== "running" && actx.resume(), true);
document.addEventListener("keydown", () => actx.state !== "running" && actx.resume(), true);

let root = null;               // FileSystemDirectoryHandle корня проекта
const takesByName = {};        // name -> [take]
const memTakes = {};           // name -> [take] (без папки)
const gameFiles = {};          // name -> [имена файлов в игре]
let cur = null;                // { s, map, tpl, S, len, ats }
let paused = null;             // время, на котором стоит пауза (null — играет)
let selTake = 0, loopIdx = 0, loopStartPerf = 0, scheduledIdx = -1, sources = [], loopSrc = null, playingTake = -1;

function nowSec() { return performance.now() / 1000; }

function buildList() {
  const q = $("search").value.trim().toLowerCase();
  const list = $("list"); list.innerHTML = "";
  let lastGroup = null;
  for (const s of SOUNDS) {
    if (q && !(s.name.includes(q) || s.prompt.toLowerCase().includes(q) || s.group.toLowerCase().includes(q) || (MAP[s.name]?.desc || "").toLowerCase().includes(q))) continue;
    if (s.group !== lastGroup) { lastGroup = s.group; const g = document.createElement("div"); g.className = "grp"; g.textContent = `${s.group} · ${s.folder}`; list.appendChild(g); }
    const it = document.createElement("div"); it.className = "item" + (cur && cur.s === s ? " sel" : ""); it.dataset.name = s.name;
    const n = (takesByName[s.name] || []).length + (memTakes[s.name] || []).length, g = (gameFiles[s.name] || []).length;
    it.innerHTML = `<span class="nm">${s.name}</span><span>${n ? `<span class="badge has">${n}</span> ` : ""}${g ? `<span class="badge done">в игре ${g}/${s.slots}</span>` : ""}</span>`;
    it.onclick = () => select(s.name);
    list.appendChild(it);
  }
}

function resetScene() {
  clearFx(); trail.clear(); trail.on = false;
  U.remove(stage); stage = new THREE.Group(); U.add(stage);
  $("ov").innerHTML = ""; $("ov").style.boxShadow = "";
  renderer.toneMappingExposure = 1.05; controls.autoRotate = false; trail.color.set(0xcfe2ff);
}

function select(name) {
  const s = BY_NAME[name]; if (!s) return;
  const map = MAP[name] || { tpl: "ui", p: { kind: "click" } };
  const tpl = TPL[map.tpl];
  resetScene();
  const S = { fired: {}, ev(key, cond = true) { if (!cond || this.fired[key]) return false; this.fired[key] = true; return true; } };
  cur = { s, map, tpl, S };
  tpl.build(S, map.p);
  tpl.cam(map.p);
  const tl = tpl.len(map.p);
  cur.len = s.loop ? Math.max(tl, 2) : Math.max(tl, s.dur + (typeof tpl.at(map.p) === "number" ? tpl.at(map.p) : 0) + 0.5);
  selTake = 0;
  location.hash = name;
  renderInfo(); renderTakes(); buildList();
  restart();
  loadBuffers(name);
}

function atsFor(i) { const a = cur.tpl.at(cur.map.p, i); return Array.isArray(a) ? a : [a]; }

function restart() {
  stopAudio(); paused = null; updatePauseBtn();
  loopIdx = 0; loopStartPerf = nowSec() + 0.08; scheduledIdx = -1;
  beginLoop(0);
  scheduleLoop(0, loopStartPerf);
  if (cur.s.loop) startLoopSound();
}
function beginLoop(i) {
  clearFx(); trail.clear();
  const S = cur.S; S.fired = {}; S.fireAcc = 0;
  for (const k of Object.keys(S)) if (["knock", "squash", "sh", "stuck"].includes(k)) S[k] = null;
  $("ov").style.boxShadow = ""; renderer.toneMappingExposure = 1.05;
  cur.tpl.loop(S, cur.map.p, i);
  renderMarks();
}
function stopAudio() { for (const s of sources) { try { s.stop(); } catch (e) {} } sources = []; if (loopSrc) { try { loopSrc.stop(); } catch (e) {} loopSrc = null; } }

function allTakes(name = cur?.s.name) { return [...(takesByName[name] || []), ...(memTakes[name] || [])]; }
function takeFor(i, k) {
  const ts = allTakes(); if (!ts.length) return null;
  if ($("optCycle").checked) return ts[(i) % ts.length];
  if (cur.tpl.rotate && ts.length > 1 && k != null) return ts[(selTake + k) % ts.length];
  return ts[Math.min(selTake, ts.length - 1)];
}
function play(take, whenPerf, loop = false) {
  if (!take || !take.buffer || !$("optSound").checked) return null;
  const src = actx.createBufferSource(); src.buffer = take.buffer; src.loop = loop; src.connect(master);
  const off = $("optTrim").checked ? take.offset : 0;
  if (loop) { src.loopStart = off; src.loopEnd = take.buffer.duration; }
  const when = actx.currentTime + Math.max(0, whenPerf - nowSec());
  src.start(when, off); sources.push(src); if (sources.length > 30) sources.shift();
  return src;
}
function scheduleLoop(i, startPerf) {
  scheduledIdx = i;
  if (cur.s.loop) return;
  atsFor(i).forEach((at, k) => {
    const take = takeFor(i, k);
    if (take) { play(take, startPerf + at); setTimeout(() => markPlaying(take), Math.max(0, (startPerf + at - nowSec()) * 1000)); }
  });
}
function startLoopSound() { const take = takeFor(0); if (loopSrc) try { loopSrc.stop(); } catch (e) {} loopSrc = play(take, nowSec(), true); markPlaying(take); }
function markPlaying(take) {
  const ts = allTakes(); playingTake = ts.indexOf(take);
  document.querySelectorAll(".take").forEach((el, i) => el.classList.toggle("playing", i === playingTake));
  $("nowPlaying").hidden = !take; if (take) $("nowPlaying").textContent = "♪ " + take.label;
}

let lastPerf = nowSec();
function frame() {
  requestAnimationFrame(frame);
  resize();
  const now = nowSec(), dt = Math.min(0.05, now - lastPerf); lastPerf = now;
  if (cur && paused != null) { $("timefill").style.width = (clamp01(paused / cur.len) * 100) + "%"; }
  else if (cur) {
    let t = now - loopStartPerf;
    if (t >= cur.len) { loopIdx++; loopStartPerf += cur.len; if (now - loopStartPerf > cur.len) loopStartPerf = now; t = now - loopStartPerf; beginLoop(loopIdx); }
    if (scheduledIdx < loopIdx + 1 && t > cur.len - 0.15) scheduleLoop(loopIdx + 1, loopStartPerf + cur.len);
    cur.tpl.tick(cur.S, Math.max(0, t), dt, cur.map.p, loopIdx);
    $("timefill").style.width = (clamp01(t / cur.len) * 100) + "%";
  }
  if (paused == null) tickFx(dt);
  if (paused == null) trail.update(cur && cur.S.h ? cur.S.h.sword : null, now);
  controls.update();
  renderer.render(scene, camera);
}

/** Пауза на моменте t (сек): анимация прогоняется с начала повтора до t. */
function seek(t) {
  stopAudio();
  beginLoop(loopIdx); trail.clear();
  const step = 1 / 120;
  for (let x = 0; x <= t + 1e-6; x += step) { cur.tpl.tick(cur.S, x, step, cur.map.p, loopIdx); tickFx(step); trail.update(cur.S.h ? cur.S.h.sword : null, x); }
  paused = t; updatePauseBtn();
}
function updatePauseBtn() { const b = $("btnPause"); if (b) b.textContent = paused == null ? "⏸ Пауза" : "▶ Дальше"; }
function togglePause() {
  if (paused == null) { const t = clamp01((nowSec() - loopStartPerf) / cur.len) * cur.len; seek(t); }
  else restart();
}

function renderMarks() {
  const bar = $("timebar"); bar.querySelectorAll(".mark").forEach((m) => m.remove());
  if (cur.s.loop) return;
  for (const at of atsFor(loopIdx)) { const m = document.createElement("div"); m.className = "mark"; m.style.left = (at / cur.len * 100) + "%"; bar.appendChild(m); }
}

function renderInfo() {
  const s = cur.s, m = cur.map;
  const ats = atsFor(0).map((a) => a.toFixed(2)).join(", ");
  const target = s.slots > 1 ? `${s.name}_01 … _0${s.slots}` : s.name;
  $("info").innerHTML = `
    <h2>${s.name}</h2>
    <div class="meta">${s.group} · в игре: <code>Audio/SFX/${s.folder}/${target}</code> · нужно вариантов: ${s.slots}</div>
    <div class="prompt" id="promptText">${s.prompt}</div>
    <div class="row">
      <button id="btnCopy">Копировать промт</button>
      <span class="badge">Duration ${s.dur} с</span><span class="badge">Influence ${s.infl}</span>${s.loop ? '<span class="badge has">Loop</span>' : ""}
      <button id="btnRestart" title="Пробел">↺ С начала</button>
      <button id="btnPause" title="P">⏸ Пауза</button>
    </div>
    <div class="desc">${m.desc || ""} ${s.loop ? "Звук играет по кругу." : `Звук стартует на <b>${ats} с</b> (жёлтые метки на полосе).`}</div>`;
  $("btnCopy").onclick = () => { navigator.clipboard.writeText(s.prompt); toast("Промт скопирован — вставь в ElevenLabs → Sound Effects"); };
  $("btnRestart").onclick = restart;
  $("btnPause").onclick = togglePause;
  $("stageHint").textContent = "Мышь: вращать (ЛКМ), двигать (ПКМ), колесо — приблизить. ↑↓ — звуки, ←→ — дубли, пробел — с начала, P — пауза, клик по полосе — перемотка.";
}

function renderTakes() {
  const box = $("takes"); box.innerHTML = "";
  const s = cur.s, ts = allTakes();
  const gf = gameFiles[s.name] || [];
  if (gf.length) { const d = document.createElement("div"); d.className = "ingame"; d.textContent = "В игре сейчас: " + gf.join(", "); box.appendChild(d); }
  if (!ts.length) {
    box.insertAdjacentHTML("beforeend", `<div class="empty">Дублей пока нет. Сгенерируй в ElevenLabs несколько вариантов и перетащи файлы сюда${root ? "" : " (или открой папку проекта, чтобы они сохранялись)"}.
      ${root ? `Можно и вручную положить файлы в <code>ArtSource/Audio/Drafts/${s.name}/</code>, потом нажать «Обновить».` : ""}</div>`);
  }
  ts.forEach((tk, i) => {
    const el = document.createElement("div"); el.className = "take" + (i === selTake ? " sel" : "");
    const slots = s.slots > 1 ? Array.from({ length: s.slots }, (_, k) => `<button data-slot="${k + 1}" title="Положить в игру как ${s.name}_0${k + 1}">→0${k + 1}</button>`).join("") : `<button data-slot="0" title="Положить в игру как ${s.name}">в игру</button>`;
    el.innerHTML = `<b>${i + 1}</b><div><div class="tn">${tk.label}</div><div class="src">${tk.src === "game" ? "уже в игре" : tk.src === "mem" ? "без сохранения" : "черновик"}${tk.buffer ? ` · ${tk.buffer.duration.toFixed(2)} с` : ""}${tk.offset > 0.02 ? ` · тишина ${tk.offset.toFixed(2)} с` : ""}</div></div>
      <canvas width="340" height="60"></canvas>
      <div class="acts">${root && tk.src !== "game" ? slots : ""}${tk.src === "draft" ? '<button data-del="1" title="Удалить черновик">🗑</button>' : ""}</div>`;
    el.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (b?.dataset.slot != null) { ev.stopPropagation(); exportTake(tk, +b.dataset.slot); return; }
      if (b?.dataset.del) { ev.stopPropagation(); deleteTake(tk); return; }
      selTake = i; $("optCycle").checked = false; renderTakes(); restart();
    };
    box.appendChild(el);
    drawWave(el.querySelector("canvas"), tk);
  });
  if (root) { const r = document.createElement("div"); r.className = "row"; r.innerHTML = '<button id="btnRescan">Обновить</button>'; box.appendChild(r); $("btnRescan").onclick = () => scan().then(() => { renderTakes(); loadBuffers(cur.s.name); }); }
}
function drawWave(cv, tk) {
  const g = cv.getContext("2d"); g.fillStyle = "#111"; g.fillRect(0, 0, cv.width, cv.height);
  if (!tk.buffer) { g.fillStyle = "#555"; g.font = "20px sans-serif"; g.fillText(tk.error || "…", 10, 38); return; }
  const d = tk.buffer.getChannelData(0), W = cv.width, H = cv.height, step = Math.max(1, Math.floor(d.length / W));
  if (tk.offset > 0) { g.fillStyle = "#2a1e1e"; g.fillRect(0, 0, tk.offset / tk.buffer.duration * W, H); }
  g.fillStyle = "#e0b45a";
  for (let x = 0; x < W; x++) { let mn = 1, mx = -1; for (let j = x * step; j < (x + 1) * step && j < d.length; j++) { const v = d[j]; if (v < mn) mn = v; if (v > mx) mx = v; } g.fillRect(x, H / 2 + mn * H / 2, 1, Math.max(1, (mx - mn) * H / 2)); }
}

async function loadBuffers(name) {
  const ts = allTakes(name);
  await Promise.all(ts.map(async (tk) => {
    if (tk.buffer || tk.error) return;
    try {
      const file = tk.file || await tk.handle.getFile();
      tk.buffer = await actx.decodeAudioData(await file.arrayBuffer());
      const d = tk.buffer.getChannelData(0); let i = 0; while (i < d.length && Math.abs(d[i]) < 0.02) i++;
      tk.offset = Math.max(0, i / tk.buffer.sampleRate - 0.01);
    } catch (e) { tk.error = "не читается"; }
  }));
  if (cur && cur.s.name === name) { renderTakes(); if (cur.s.loop) startLoopSound(); }
}

// =====================================================================================================
// Папка проекта (File System Access API)
// =====================================================================================================
const DRAFTS = ["ArtSource", "Audio", "Drafts"], SFX = ["Assets", "_Project", "Audio", "SFX"];
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("soundlab", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res) => { const tx = db.transaction("h", "readwrite"); tx.objectStore("h").put(v, k); tx.oncomplete = res; }); }
async function idbGet(k) { const db = await idb(); return new Promise((res) => { const r = db.transaction("h").objectStore("h").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
async function dir(base, parts, create = false) { let d = base; for (const p of parts) d = await d.getDirectoryHandle(p, { create }); return d; }
async function tryDir(base, parts) { try { return await dir(base, parts); } catch (e) { return null; } }

async function openFolder() {
  if (!window.showDirectoryPicker) { toast("Этот браузер не умеет открывать папки — используй Chrome или Edge (или кнопку «Файлы…»)"); return; }
  try {
    const h = await window.showDirectoryPicker({ id: "coliseum", mode: "readwrite" });
    if (!(await tryDir(h, ["Assets"]))) { toast("Это не корень проекта: внутри нет папки Assets. Выбери папку ColizeunGame."); return; }
    root = h; await idbSet("root", h); await scan(); afterScan();
  } catch (e) { if (e.name !== "AbortError") toast("Не удалось открыть папку: " + e.message); }
}
async function restoreFolder() {
  const h = await idbGet("root").catch(() => null); if (!h) return;
  const perm = await h.queryPermission({ mode: "readwrite" });
  if (perm === "granted") { root = h; await scan(); afterScan(); return; }
  const b = $("btnFolder"); b.textContent = `Разрешить доступ к «${h.name}»`;
  b.onclick = async () => { if ((await h.requestPermission({ mode: "readwrite" })) === "granted") { root = h; b.textContent = "Сменить папку"; b.onclick = openFolder; await scan(); afterScan(); } };
}
function afterScan() {
  $("btnFolder").textContent = "Сменить папку"; $("btnFolder").onclick = openFolder; $("btnFolder").classList.remove("primary");
  let n = 0; for (const k in takesByName) n += takesByName[k].length;
  $("folderInfo").innerHTML = `Папка: <b>${root.name}</b>. Дублей: ${n}. Черновики — <code>ArtSource/Audio/Drafts/&lt;звук&gt;/</code>.`;
  buildList(); if (cur) { renderTakes(); loadBuffers(cur.s.name); }
}
async function scan() {
  for (const k in takesByName) delete takesByName[k];
  for (const k in gameFiles) delete gameFiles[k];
  const drafts = await dir(root, DRAFTS, true);
  const add = (name, tk) => (takesByName[name] = takesByName[name] || []).push(tk);
  for await (const [n, h] of drafts.entries()) {
    if (h.kind === "directory" && BY_NAME[n]) {
      const files = []; for await (const [fn, fh] of h.entries()) if (fh.kind === "file" && AUDIO_EXT.test(fn)) files.push([fn, fh]);
      files.sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
      for (const [fn, fh] of files) add(n, { label: fn, handle: fh, dirHandle: h, fname: fn, src: "draft" });
    } else if (h.kind === "file" && AUDIO_EXT.test(n)) { const b = matchBase(n); if (b) add(b, { label: n, handle: h, dirHandle: drafts, fname: n, src: "draft" }); }
  }
  const sfx = await tryDir(root, SFX);
  if (sfx) for (const folder of new Set(SOUNDS.map((s) => s.folder))) {
    const d = await tryDir(sfx, [folder]); if (!d) continue;
    for await (const [fn, fh] of d.entries()) {
      if (fh.kind !== "file" || !AUDIO_EXT.test(fn)) continue;
      const b = matchBase(fn); if (!b || BY_NAME[b].folder !== folder) continue;
      (gameFiles[b] = gameFiles[b] || []).push(fn);
      add(b, { label: fn, handle: fh, dirHandle: d, fname: fn, src: "game" });
    }
  }
  for (const k in takesByName) takesByName[k].sort((a, b) => (a.src === "game") - (b.src === "game"));
}

async function saveDropped(files) {
  if (!cur) return;
  const name = cur.s.name;
  const audio = [...files].filter((f) => AUDIO_EXT.test(f.name) || f.type.startsWith("audio/"));
  if (!audio.length) { toast("Это не аудиофайлы"); return; }
  if (!root) {
    for (const f of audio) (memTakes[name] = memTakes[name] || []).push({ label: f.name, file: f, src: "mem" });
    toast(`Добавлено ${audio.length} (без сохранения — открой папку проекта, чтобы сохранялось)`);
  } else {
    const d = await dir(root, [...DRAFTS, name], true);
    const used = new Set(); for await (const [fn] of d.entries()) used.add(fn.toLowerCase());
    let n = 1;
    for (const f of audio) {
      const ext = (f.name.match(/\.[^.]+$/) || [".mp3"])[0].toLowerCase();
      while ([...used].some((u) => u.startsWith(`${name}_take${n}.`))) n++;
      const fn = `${name}_take${n}${ext}`; used.add(fn);
      const fh = await d.getFileHandle(fn, { create: true }); const w = await fh.createWritable(); await w.write(f); await w.close();
    }
    toast(`Сохранено ${audio.length} в ArtSource/Audio/Drafts/${name}/`);
    await scan();
  }
  buildList(); renderTakes(); loadBuffers(name);
}
async function exportTake(tk, slot) {
  const s = cur.s;
  const ext = (tk.fname || tk.label).match(/\.[^.]+$/)?.[0].toLowerCase() || ".mp3";
  const base = slot ? `${s.name}_0${slot}` : s.name;
  const d = await dir(root, [...SFX, s.folder], true);
  // тот же слот с другим расширением (было .wav, кладём .mp3) — убрать вместе с .meta, чтобы в игре не было двух файлов
  const stale = [];
  for await (const [fn] of d.entries()) {
    const low = fn.toLowerCase(), noMeta = low.replace(/\.meta$/, "");
    if (noMeta.replace(/\.[^.]+$/, "") === base && AUDIO_EXT.test(noMeta) && noMeta !== base + ext) stale.push(fn);
  }
  for (const fn of stale) await d.removeEntry(fn);
  const file = tk.file || await tk.handle.getFile();
  const fh = await d.getFileHandle(base + ext, { create: true }); const w = await fh.createWritable(); await w.write(file); await w.close();
  toast(`В игре: Audio/SFX/${s.folder}/${base}${ext}`);
  await scan(); buildList(); renderTakes(); loadBuffers(s.name);
}
async function deleteTake(tk) {
  if (!confirm(`Удалить черновик ${tk.label}? Файл удалится с диска.`)) return;
  await tk.dirHandle.removeEntry(tk.fname); await scan(); buildList(); renderTakes(); loadBuffers(cur.s.name);
}

// ---------- события интерфейса ----------
$("btnFolder").onclick = openFolder;
$("btnFiles").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { saveDropped(e.target.files); e.target.value = ""; };
$("search").oninput = buildList;
$("optVol").oninput = (e) => master.gain.value = +e.target.value;
$("optSound").onchange = restart; $("optTrim").onchange = restart; $("optCycle").onchange = restart;
const drop = $("drop");
for (const el of [document.body]) {
  el.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  el.addEventListener("dragleave", (e) => { if (e.target === drop || !e.relatedTarget) drop.classList.remove("over"); });
  el.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); saveDropped(e.dataTransfer.files); });
}
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type !== "checkbox" && e.target.type !== "range") return;
  if (!cur) return;
  const vis = [...document.querySelectorAll(".item")].map((x) => x.dataset.name), i = vis.indexOf(cur.s.name);
  if (e.key === "ArrowDown" && i < vis.length - 1) { select(vis[i + 1]); e.preventDefault(); }
  if (e.key === "ArrowUp" && i > 0) { select(vis[i - 1]); e.preventDefault(); }
  const n = allTakes().length;
  if (e.key === "ArrowRight" && n) { selTake = (selTake + 1) % n; renderTakes(); restart(); e.preventDefault(); }
  if (e.key === "ArrowLeft" && n) { selTake = (selTake - 1 + n) % n; renderTakes(); restart(); e.preventDefault(); }
  if (e.key === " ") { restart(); e.preventDefault(); }
  if (e.key === "p" || e.key === "з") togglePause();
  document.querySelector(".item.sel")?.scrollIntoView({ block: "nearest" });
});

await loadKatana().catch((e) => console.warn("katana", e));
buildList();
select(BY_NAME[decodeURIComponent(location.hash.slice(1))] ? decodeURIComponent(location.hash.slice(1)) : "sword_swing");
restoreFolder();
requestAnimationFrame(frame);
// клик по полосе времени — перемотка с паузой
$("timebar").style.pointerEvents = "auto"; $("timebar").style.cursor = "pointer";
$("timebar").onclick = (e) => { const r = $("timebar").getBoundingClientRect(); seek(clamp01((e.clientX - r.left) / r.width) * cur.len); };
window.__soundlab = { TPL, MAP, SOUNDS, select, seek, addFiles: saveDropped, allTakes, get sources() { return sources; }, get cur() { return cur; } };
</script>
